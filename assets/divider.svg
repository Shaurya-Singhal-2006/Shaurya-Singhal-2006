<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 44" width="1000" height="44" shape-rendering="crispEdges" role="presentation" xmlns:c2pa="http://c2pa.org/manifest">
  <!-- twinkling background stars -->
  <rect x="60" y="6" width="3" height="3" fill="#e9e6ff"><animate attributeName="opacity" values="1;0.2" calcMode="discrete" dur="1.4s" repeatCount="indefinite"/></rect>
  <rect x="240" y="10" width="3" height="3" fill="#5cc8ff"><animate attributeName="opacity" values="0.2;1" calcMode="discrete" dur="1.8s" repeatCount="indefinite"/></rect>
  <rect x="430" y="4" width="3" height="3" fill="#ff3df2"><animate attributeName="opacity" values="1;0.2" calcMode="discrete" dur="1.1s" repeatCount="indefinite"/></rect>
  <rect x="610" y="9" width="3" height="3" fill="#e9e6ff"><animate attributeName="opacity" values="0.2;1" calcMode="discrete" dur="1.6s" repeatCount="indefinite"/></rect>
  <rect x="800" y="5" width="3" height="3" fill="#ffb703"><animate attributeName="opacity" values="1;0.2" calcMode="discrete" dur="1.3s" repeatCount="indefinite"/></rect>
  <rect x="945" y="11" width="3" height="3" fill="#5cc8ff"><animate attributeName="opacity" values="0.2;1" calcMode="discrete" dur="1.7s" repeatCount="indefinite"/></rect>

  <!-- ground -->
  <line x1="0" y1="39" x2="1000" y2="39" stroke="#2b6fd6" stroke-width="6" stroke-dasharray="10 4" opacity="0.5"/>

  <!-- obstacles -->
  <rect x="86" y="28" width="8" height="8" fill="#ff3df2"/>
  <rect x="286" y="28" width="8" height="8" fill="#ff3df2"/>
  <rect x="486" y="28" width="8" height="8" fill="#ff3df2"/>
  <rect x="686" y="28" width="8" height="8" fill="#ff3df2"/>
  <rect x="886" y="28" width="8" height="8" fill="#ff3df2"/>

  <!-- coins -->
  <polygon points="190,20 195,25 190,30 185,25" fill="#ffb703"><animate attributeName="opacity" values="1;0.3" calcMode="discrete" dur="0.8s" repeatCount="indefinite"/></polygon>
  <polygon points="390,20 395,25 390,30 385,25" fill="#ffb703"><animate attributeName="opacity" values="0.3;1" calcMode="discrete" dur="0.8s" repeatCount="indefinite"/></polygon>
  <polygon points="590,20 595,25 590,30 585,25" fill="#ffb703"><animate attributeName="opacity" values="1;0.3" calcMode="discrete" dur="0.8s" repeatCount="indefinite"/></polygon>
  <polygon points="790,20 795,25 790,30 785,25" fill="#ffb703"><animate attributeName="opacity" values="0.3;1" calcMode="discrete" dur="0.8s" repeatCount="indefinite"/></polygon>

  <!-- runner: hops over every obstacle -->
  <g>
    <rect x="-4" y="-8" width="8" height="8" fill="#5cc8ff"/>
    <rect x="0" y="-6" width="2" height="2" fill="#0d1233"/>
    <rect x="-4" y="-2" width="3" height="2" fill="#2b6fd6"/>
    <animateMotion dur="7s" repeatCount="indefinite" calcMode="linear"
      path="M-10 36 H70 q20 -36 40 0 H270 q20 -36 40 0 H470 q20 -36 40 0 H670 q20 -36 40 0 H870 q20 -36 40 0 H1010"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
